name: build-windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate placeholder icons
        working-directory: apps/launcher
        run: pnpm exec tauri icon src-tauri/app-icon.svg

      - name: Typecheck and build launcher
        working-directory: apps/launcher
        run: pnpm build

      - name: Build Windows bundle
        working-directory: apps/launcher
        run: pnpm exec tauri build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paranoia-client-windows
          if-no-files-found: error
          path: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
            apps/launcher/src-tauri/target/release/paranoia-launcher.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
            apps/launcher/src-tauri/target/release/paranoia-launcher.exe