name: build-windows

on:
  # La branche par defaut du depot est ci/windows-exe-build: en ne ciblant que
  # main, ce workflow ne se declenchait jamais.
  push:
    branches:
      - main
      - ci/windows-exe-build
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - ci/windows-exe-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Le backend n'etait compile nulle part dans la CI: ses erreurs de type
      # ne remontaient qu'au lancement en local.
      - name: Typecheck workspace
        run: pnpm -r typecheck

  build:
    runs-on: windows-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate placeholder icons
        working-directory: apps/launcher
        run: pnpm exec tauri icon src-tauri/app-icon.svg

      - name: Typecheck and build launcher
        working-directory: apps/launcher
        run: pnpm build

      # Doit precede le bundle: tauri.conf.json declare le backend en
      # externalBin et echoue si le binaire n'existe pas encore.
      - name: Build backend sidecar
        run: pnpm --filter @paranoia/backend build:sidecar

      - name: Build Windows bundle
        working-directory: apps/launcher
        run: pnpm exec tauri build --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paranoia-client-windows
          if-no-files-found: error
          path: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
            apps/launcher/src-tauri/target/release/paranoia-launcher.exe

      # Pousser un tag `v0.1.0` publie l'installeur en release GitHub, seule
      # forme telechargeable sans compte connecte.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Paranoia Client ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe