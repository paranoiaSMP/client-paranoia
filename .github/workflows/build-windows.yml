name: build-windows

on:
  push:
    branches:
      - main
      - ci/windows-exe-build
      - "release/**"
      - "claude/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - ci/windows-exe-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm -r typecheck

      - name: Test the update manifest composer
        run: node scripts/test-update-manifest.mjs

      - name: Test the graphics preset
        run: pnpm --filter @paranoia/backend test:preset

      - name: Test the Sodium preset
        run: pnpm --filter @paranoia/backend test:sodium

      - name: Test the Minecraft version list and the snapshot
        run: pnpm --filter @paranoia/backend test:versions

      - name: Test the Microsoft session renewal
        run: pnpm --filter @paranoia/backend test:auth

      - name: Test the session restore at startup
        run: pnpm --filter @paranoia/backend test:restore

      - name: Test the Java detection
        run: pnpm --filter @paranoia/backend test:java

      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Test the JVM flags on every Java the launcher can pick
        run: |
          for major in 21 25; do
            home_var="JAVA_HOME_${major}_X64"
            home="${!home_var}"
            if [ -z "$home" ] || [ ! -x "$home/bin/java" ]; then
              echo "::error::JDK $major absent du runner ($home_var non defini)"
              exit 1
            fi
            echo "=============== Java $major"
            JAVA_BIN="$home/bin/java" pnpm --filter @paranoia/backend test:jvm
          done

  mod:
    uses: ./.github/workflows/build-mod.yml

  build:
    runs-on: windows-latest
    needs: [checks, mod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*)          tag="${GITHUB_REF_NAME}" ;;
            refs/heads/release/*)  tag="${GITHUB_REF_NAME#release/}" ;;
            *)                     tag="" ;;
          esac

          if [ -n "$tag" ]; then
            echo "publication de $tag"
          else
            echo "build simple, aucune publication"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check tag matches app version
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag="${RELEASE_TAG#v}"
          app=$(node -p "require('./apps/launcher/src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::publication de $RELEASE_TAG mais tauri.conf.json declare $app -- lancer scripts/bump-version.mjs $tag"
            exit 1
          fi
          echo "version coherente: $app"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/launcher/src-tauri

      - name: Ensure Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure MSVC for node-gyp
        shell: pwsh
        run: |
          npm config set msvs_version 2022
          setx GYP_MSVS_VERSION 2022

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate placeholder icons
        working-directory: apps/launcher
        run: pnpm exec tauri icon src-tauri/app-icon.png

      - name: Typecheck and build launcher
        working-directory: apps/launcher
        run: pnpm build

      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          name: paranoia-client-mod
          path: mod-jars

      - name: Inject client mod into catalog
        if: steps.release.outputs.tag != ''
        run: node apps/backend/scripts/inject-client-mod.mjs mod-jars ${{ steps.release.outputs.tag }} ${{ github.repository }}

      - name: Build backend sidecar
        run: pnpm --filter @paranoia/backend build:sidecar

      - name: Smoke test sidecar
        shell: pwsh
        run: |
          $exe = Get-ChildItem "apps/launcher/src-tauri/binaries/paranoia-server-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "sidecar introuvable dans binaries/" }
          Write-Host "sidecar: $($exe.Name) ($([math]::Round($exe.Length / 1MB)) Mo)"

          $env:PORT = "47820"
          $proc = Start-Process -FilePath $exe.FullName -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($i in 1..30) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:47820/health" -TimeoutSec 2
                if ($health.ok) { $ready = $true; break }
              } catch { }
            }
            if (-not $ready) { throw "le sidecar n'a pas repondu sur /health en 30s" }
            Write-Host "health: OK"

            $config = Invoke-RestMethod -Uri "http://127.0.0.1:47820/v1/catalog/remote-config" -TimeoutSec 5
            if (-not $config.supportedMinecraftVersions) { throw "catalogue vide ou absent" }
            Write-Host "catalogue: OK ($($config.supportedMinecraftVersions.Count) versions)"

            $profiles = Invoke-RestMethod -Uri "http://127.0.0.1:47820/v1/profiles" -TimeoutSec 5
            Write-Host "profils: OK"

            if ("${{ steps.release.outputs.tag }}" -ne "") {
              $cases = @(
                @{ version = "1.21.8";  type = "pvp";     mode = "balanced" },
                @{ version = "1.21.11"; type = "pvp";     mode = "balanced" },
                @{ version = "1.21.11"; type = "inconnu"; mode = "inconnu"  }
              )

              foreach ($case in $cases) {
                $label = "$($case.version) $($case.type)/$($case.mode)"
                $body = @{
                  minecraftVersion = $case.version
                  profileTypeId = $case.type
                  graphicsModeId = $case.mode
                } | ConvertTo-Json -Compress

                $manifest = Invoke-RestMethod -Uri "http://127.0.0.1:47820/v1/catalog/manifest" `
                  -Method Post -ContentType "application/json" -Body $body -TimeoutSec 5

                if (-not $manifest.clientMod) {
                  throw "manifeste sans clientMod pour $label : le mod ne serait pas installe"
                }
                if ($manifest.clientMod.fileName -notlike "*+$($case.version).jar") {
                  throw "mauvais jar pour $label : $($manifest.clientMod.fileName)"
                }
                Write-Host "mod client $label : OK ($($manifest.clientMod.fileName))"
              }

              # Une snapshot: manifeste rendu pour la bonne version, et sans le
              # jar d'une autre -- il serait refuse au telechargement, ou charge.
              $horsCatalogue = @{
                minecraftVersion = "26w40a"
                profileTypeId = "pvp"
                graphicsModeId = "balanced"
              } | ConvertTo-Json -Compress

              $snap = Invoke-RestMethod -Uri "http://127.0.0.1:47820/v1/catalog/manifest" `
                -Method Post -ContentType "application/json" -Body $horsCatalogue -TimeoutSec 5

              if ($snap.minecraftVersion -ne "26w40a") {
                throw "manifeste d'une snapshot : version rendue $($snap.minecraftVersion)"
              }
              if ($snap.clientMod) {
                throw "manifeste d'une snapshot : clientMod $($snap.clientMod.fileName) alors qu'aucun jar n'existe"
              }
              Write-Host "snapshot hors catalogue : OK (manifeste vanilla, sans mod)"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows bundle
        working-directory: apps/launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --bundles nsis

      - name: Verify sidecar is bundled
        shell: pwsh
        run: |
          $dir = "apps/launcher/src-tauri/target/release"
          $sidecar = Get-ChildItem "$dir/paranoia-server*.exe" -ErrorAction SilentlyContinue
          if (-not $sidecar) {
            Get-ChildItem $dir -Filter *.exe | ForEach-Object { Write-Host " - $($_.Name)" }
            throw "le sidecar n'a pas ete copie a cote de l'executable"
          }
          Write-Host "sidecar empaquete: $($sidecar.Name)"

          $installer = Get-ChildItem "$dir/bundle/nsis/*.exe"
          Write-Host "installeur: $($installer.Name) ($([math]::Round($installer.Length / 1MB)) Mo)"
          if ($installer.Length -lt 20MB) {
            throw "installeur suspect ($([math]::Round($installer.Length / 1MB)) Mo): le backend n'y est probablement pas"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paranoia-client-windows
          if-no-files-found: error
          path: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
            apps/launcher/src-tauri/target/release/paranoia-launcher.exe

      - name: Verify signature
        if: steps.release.outputs.tag != ''
        shell: pwsh
        run: |
          $nsis = "apps/launcher/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem "$nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "installeur NSIS introuvable" }
          if (-not (Test-Path "$($installer.FullName).sig")) {
            throw "signature absente: le secret TAURI_SIGNING_PRIVATE_KEY est-il configure ?"
          }
          Write-Host "signature presente pour $($installer.Name)"

      - name: Create GitHub Release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Paranoia Client ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            apps/launcher/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/launcher/src-tauri/target/release/bundle/nsis/*-setup.nsis.zip
            apps/launcher/src-tauri/target/release/bundle/nsis/*-setup.nsis.zip.sig
            apps/launcher/src-tauri/target/release/bundle/nsis/*.sig
            mod-jars/**/*.jar

      # Les jars du mod etaient attaches ici jusqu'au 25 septembre, et la ligne
      # a ete retiree -- mais pas l'injection, qui continue d'ecrire dans le
      # catalogue des URL de release GitHub. Chaque telechargement du mod
      # repondait donc 404, et comme un mod qui ne s'installe pas ne doit jamais
      # empecher de jouer, le jeu se lancait sans le client Paranoia, sans que
      # rien ne le dise au joueur. Quatre versions ont ete publiees ainsi.
      #
      # Une URL qui ne repond pas fait echouer la publication a partir de
      # maintenant: c'est la seule facon que ce silence-la ne revienne pas.
      - name: Verify every injected mod URL resolves
        if: steps.release.outputs.tag != ''
        shell: pwsh
        run: |
          $catalogue = Get-Content examples/remote-config/install-catalog.json -Raw | ConvertFrom-Json
          $urls = $catalogue.entries |
            Where-Object { $_.clientMod } |
            ForEach-Object { $_.clientMod.downloadUrl } |
            Select-Object -Unique

          if (-not $urls) {
            throw "le catalogue ne reference aucun mod: l'injection n'a pas eu lieu"
          }

          # Trois essais: la release vient d'etre creee, et ses actifs ne sont
          # pas toujours servis dans la seconde. Faire echouer une publication
          # sur une propagation en cours serait pire que le defaut corrige ici.
          $manquants = @()
          foreach ($url in $urls) {
            $ok = $false
            foreach ($essai in 1..3) {
              try {
                $reponse = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5
                Write-Host "$($reponse.StatusCode)  $url"
                $ok = $true
                break
              } catch {
                if ($essai -lt 3) { Start-Sleep -Seconds (5 * $essai) }
              }
            }
            if (-not $ok) {
              $manquants += $url
              Write-Host "ECHEC   $url"
            }
          }

          if ($manquants.Count -gt 0) {
            throw "$($manquants.Count) jar(s) annonce(s) par le catalogue sont absents de la release"
          }
          Write-Host "les $($urls.Count) jars annonces par le catalogue sont bien publies"

      - name: Publish update manifest
        if: steps.release.outputs.tag != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nsis = "apps/launcher/src-tauri/target/release/bundle/nsis"
          $archive = Get-ChildItem "$nsis/*-setup.nsis.zip" | Select-Object -First 1
          if (-not $archive) { throw "archive .nsis.zip introuvable" }
          $name = $archive.Name.Replace(' ', '.')
          $base = "https://github.com/${{ github.repository }}/releases/download"

          node scripts/update-manifest.mjs `
            --tag "${{ steps.release.outputs.tag }}" `
            --platform windows-x86_64 `
            --signature "$($archive.FullName).sig" `
            --url "$base/${{ steps.release.outputs.tag }}/$name"
          if ($LASTEXITCODE -ne 0) { throw "publication du manifeste echouee" }
