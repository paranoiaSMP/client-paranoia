name: build-macos

on:
  push:
    branches:
      - main
      - ci/windows-exe-build
      - "release/**"
      - "claude/**"
      - "leoo955/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - ci/windows-exe-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm -r typecheck

  mod:
    uses: ./.github/workflows/build-mod.yml

  build:
    runs-on: ${{ matrix.os }}
    needs: [checks, mod]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*)          tag="${GITHUB_REF_NAME}" ;;
            refs/heads/release/*)  tag="${GITHUB_REF_NAME#release/}" ;;
            *)                     tag="" ;;
          esac

          if [ -n "$tag" ]; then
            echo "publication de $tag"
          else
            echo "build simple, aucune publication"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check tag matches app version
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag="${RELEASE_TAG#v}"
          app=$(node -p "require('./apps/launcher/src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::publication de $RELEASE_TAG mais tauri.conf.json declare $app -- lancer scripts/bump-version.mjs $tag"
            exit 1
          fi
          echo "version coherente: $app"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/launcher/src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate placeholder icons
        working-directory: apps/launcher
        run: pnpm exec tauri icon src-tauri/app-icon.png

      - name: Typecheck and build launcher
        working-directory: apps/launcher
        run: pnpm build

      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          name: paranoia-client-mod
          path: mod-jars

      - name: Inject client mod into catalog
        if: steps.release.outputs.tag != ''
        run: node apps/backend/scripts/inject-client-mod.mjs mod-jars ${{ steps.release.outputs.tag }} ${{ github.repository }}

      - name: Build backend sidecar
        run: |
          pnpm --filter @paranoia/backend build:sidecar
          cd apps/launcher/src-tauri/binaries
          SRC=$(ls paranoia-server-* 2>/dev/null | head -n 1)
          if [ -n "$SRC" ]; then
            echo "Binaire source trouvé : $SRC"
            [ -f paranoia-server-${{ matrix.target }} ] || cp "$SRC" paranoia-server-${{ matrix.target }}
            chmod +x paranoia-server-*
          else
            echo "Aucun sidecar trouvé dans binaries/"
            exit 1
          fi
          ls -la

      - name: Smoke test sidecar
        shell: bash
        run: |
          exe="apps/launcher/src-tauri/binaries/paranoia-server-${{ matrix.target }}"
          if [ ! -f "$exe" ]; then
            echo "sidecar introuvable: $exe"
            exit 1
          fi
          echo "sidecar testé : $exe"
          chmod +x "$exe"

          PORT=47820 "$exe" &
          PID=$!

          ready=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -s -f http://127.0.0.1:47820/health > /dev/null; then
              ready=1
              break
            fi
          done

          if [ $ready -ne 1 ]; then
            kill -9 $PID 2>/dev/null || true
            echo "le sidecar n'a pas repondu sur /health en 30s"
            exit 1
          fi
          echo "health: OK"

          curl -s -f http://127.0.0.1:47820/v1/catalog/remote-config > /dev/null || {
            kill -9 $PID 2>/dev/null || true
            echo "catalogue vide ou absent"
            exit 1
          }
          echo "catalogue: OK"

          kill -9 $PID 2>/dev/null || true

      - name: Build macOS bundle
        working-directory: apps/launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles dmg,app

      - name: Verify sidecar is bundled
        shell: bash
        run: |
          app=$(find apps/launcher/src-tauri/target -name "*.app" -type d | grep -E "bundle/(macos|osx)" | head -n 1)
          if [ -z "$app" ]; then
            echo "Bundle .app introuvable"
            exit 1
          fi
          echo "App bundle: $app"
          if ! ls "$app/Contents/MacOS/paranoia-server"* 1> /dev/null 2>&1; then
            echo "sidecar introuvable dans $app/Contents/MacOS"
            exit 1
          fi
          echo "Sidecar bien present dans le bundle macOS"

          dmg=$(find apps/launcher/src-tauri/target -name "*.dmg" | grep -E "bundle/dmg" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "DMG introuvable"
            exit 1
          fi
          echo "DMG genere: $dmg"

      - name: Verify signature
        if: steps.release.outputs.tag != ''
        shell: bash
        run: |
          sig=$(find apps/launcher/src-tauri/target -name "*.app.tar.gz.sig" | head -n 1)
          if [ -z "$sig" ]; then
            echo "::error::Signature .app.tar.gz.sig absente : verifier le secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          echo "Signature valide : $sig"

      - name: Rename updater archive with architecture
        shell: bash
        run: |
          for f in apps/launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*; do
            if [ -f "$f" ]; then
              dir=$(dirname "$f")
              base=$(basename "$f")
              new_base="${base// /.}"
              new_name="${new_base/.app.tar.gz/_${{ matrix.arch }}.app.tar.gz}"
              if [ "$base" != "$new_name" ]; then
                mv "$f" "$dir/$new_name"
              fi
            fi
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paranoia-client-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/launcher/src-tauri/target/**/bundle/dmg/*.dmg
            apps/launcher/src-tauri/target/**/bundle/macos/*.app.tar.gz*

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write

    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*)          tag="${GITHUB_REF_NAME}" ;;
            refs/heads/release/*)  tag="${GITHUB_REF_NAME#release/}" ;;
            *)                     tag="" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paranoia-client-macos-*
          path: artifacts
          merge-multiple: true

      - name: Verify signature before publishing
        shell: bash
        run: |
          ls -la artifacts/
          for arch in aarch64 x86_64; do
            archive=$(find artifacts -name "*${arch}*.app.tar.gz" | head -n 1)
            if [ -n "$archive" ]; then
              if [ ! -f "${archive}.sig" ]; then
                echo "::error::Signature absente pour $archive"
                exit 1
              fi
              echo "Signature valide pour $archive"
            fi
          done

      - name: Generate update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" -p "latest.json" -D artifacts || true

          node -e "
            const fs = require('fs');
            const version = process.env.RELEASE_TAG.replace(/^v/, '');
            const pub_date = new Date().toISOString();
            let manifest = {
              version,
              notes: 'Voir les notes de version sur GitHub.',
              pub_date,
              platforms: {}
            };
            if (fs.existsSync('artifacts/latest.json')) {
              try {
                manifest = JSON.parse(fs.readFileSync('artifacts/latest.json', 'utf8'));
              } catch (e) {}
            }
            manifest.version = version;
            manifest.pub_date = pub_date;

            const files = fs.readdirSync('artifacts');
            const archs = [
              { key: 'darwin-aarch64', match: 'aarch64' },
              { key: 'darwin-x86_64', match: 'x86_64' }
            ];

            for (const { key, match } of archs) {
              const archive = files.find(f => f.includes(match) && f.endsWith('.app.tar.gz'));
              if (archive) {
                const sigFile = 'artifacts/' + archive + '.sig';
                if (fs.existsSync(sigFile)) {
                  const signature = fs.readFileSync(sigFile, 'utf8').trim();
                  manifest.platforms[key] = {
                    signature,
                    url: \`https://github.com/\${process.env.REPO}/releases/download/\${process.env.RELEASE_TAG}/\${archive}\`
                  };
                }
              }
            }

            fs.writeFileSync('artifacts/latest.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Paranoia Client ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/latest.json
