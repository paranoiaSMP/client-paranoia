name: build-macos

on:
  push:
    branches:
      - main
      - ci/windows-exe-build
      - "release/**"
      - "claude/**"
      - "leoo955/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - ci/windows-exe-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm -r typecheck

  mod:
    uses: ./.github/workflows/build-mod.yml

  build:
    runs-on: macos-14
    needs: [checks, mod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*)          tag="${GITHUB_REF_NAME}" ;;
            refs/heads/release/*)  tag="${GITHUB_REF_NAME#release/}" ;;
            *)                     tag="" ;;
          esac

          if [ -n "$tag" ]; then
            echo "publication de $tag"
          else
            echo "build simple, aucune publication"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check tag matches app version
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          tag="${RELEASE_TAG#v}"
          app=$(node -p "require('./apps/launcher/src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::publication de $RELEASE_TAG mais tauri.conf.json declare $app -- lancer scripts/bump-version.mjs $tag"
            exit 1
          fi
          echo "version coherente: $app"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/launcher/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate placeholder icons
        working-directory: apps/launcher/src-tauri
        run: pnpm exec tauri icon app-icon.svg

      - name: Typecheck and build launcher
        working-directory: apps/launcher
        run: pnpm build

      - name: Download mod jars
        uses: actions/download-artifact@v4
        with:
          name: paranoia-client-mod
          path: mod-jars

      - name: Inject client mod into catalog
        if: steps.release.outputs.tag != ''
        run: node apps/backend/scripts/inject-client-mod.mjs mod-jars ${{ steps.release.outputs.tag }} ${{ github.repository }}

      - name: Build backend sidecar
        run: pnpm --filter @paranoia/backend build:sidecar

      - name: Smoke test sidecar
        shell: bash
        run: |
          exe=$(find apps/launcher/src-tauri/binaries -name "paranoia-server-*" -type f | head -n 1)
          if [ -z "$exe" ]; then
            echo "sidecar introuvable dans binaries/"
            exit 1
          fi
          echo "sidecar: $exe"
          chmod +x "$exe"

          PORT=47820 "$exe" &
          PID=$!

          ready=0
          for i in $(seq 1 30); do
            sleep 1
            if curl -s -f http://127.0.0.1:47820/health > /dev/null; then
              ready=1
              break
            fi
          done

          if [ $ready -ne 1 ]; then
            kill -9 $PID 2>/dev/null || true
            echo "le sidecar n'a pas repondu sur /health en 30s"
            exit 1
          fi
          echo "health: OK"

          curl -s -f http://127.0.0.1:47820/v1/catalog/remote-config > /dev/null || {
            kill -9 $PID 2>/dev/null || true
            echo "catalogue vide ou absent"
            exit 1
          }
          echo "catalogue: OK"

          kill -9 $PID 2>/dev/null || true

      - name: Build macOS bundle
        working-directory: apps/launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --bundles dmg,app

      - name: Verify sidecar is bundled
        shell: bash
        run: |
          app=$(find apps/launcher/src-tauri/target/release/bundle/macos -name "*.app" -type d | head -n 1)
          if [ -z "$app" ]; then
            echo "Bundle .app introuvable"
            exit 1
          fi
          echo "App bundle: $app"
          if ! ls "$app/Contents/MacOS/paranoia-server"* 1> /dev/null 2>&1; then
            echo "sidecar introuvable dans $app/Contents/MacOS"
            exit 1
          fi
          echo "Sidecar bien present dans le bundle macOS"

          dmg=$(find apps/launcher/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$dmg" ]; then
            echo "DMG introuvable dans bundle/dmg"
            exit 1
          fi
          echo "DMG genere: $dmg"

      - name: Verify signature
        if: steps.release.outputs.tag != ''
        shell: bash
        run: |
          sig=$(find apps/launcher/src-tauri/target/release/bundle/macos -name "*.app.tar.gz.sig" | head -n 1)
          if [ -z "$sig" ]; then
            echo "::error::Signature .app.tar.gz.sig absente : verifier le secret TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          echo "Signature valide : $sig"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paranoia-client-macos
          if-no-files-found: error
          path: |
            apps/launcher/src-tauri/target/release/bundle/dmg/*.dmg
            apps/launcher/src-tauri/target/release/bundle/macos/*.app.tar.gz*

  release:
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
    permissions:
      contents: write

    steps:
      - name: Determine release tag
        id: release
        shell: bash
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*)          tag="${GITHUB_REF_NAME}" ;;
            refs/heads/release/*)  tag="${GITHUB_REF_NAME#release/}" ;;
            *)                     tag="" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: paranoia-client-macos
          path: artifacts

      - name: Verify signature before publishing
        shell: bash
        run: |
          sig=$(find artifacts -name "*.app.tar.gz.sig" | head -n 1)
          if [ -z "$sig" ]; then
            echo "::error::Signature .app.tar.gz.sig absente, publication annulee"
            exit 1
          fi
          echo "Signature valide : $sig"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Paranoia Client ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
