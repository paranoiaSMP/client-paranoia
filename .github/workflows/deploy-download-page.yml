name: deploy-download-page

# Publie la page de telechargement sur GitHub Pages.
# A activer une fois dans Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-download-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois, sans annuler celle deja en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
