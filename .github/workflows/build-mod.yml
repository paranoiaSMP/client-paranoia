name: build-mod

# Le mod Fabric n'etait construit nulle part: il n'existait que sous forme de
# sources jamais compilees. Ce workflow est le seul compilateur du projet pour
# cette partie, et il tourne sur ubuntu (facture 1x, contre 2x pour windows).
on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
    paths:
      - "apps/client-mod/**"
      - ".github/workflows/build-mod.yml"
  pull_request:
    paths:
      - "apps/client-mod/**"
      - ".github/workflows/build-mod.yml"
  workflow_dispatch:
  # Appele par build-windows au moment d'une release, pour que les jars du mod
  # soient produits une seule fois et injectes dans le catalogue.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 21, et pas plus recent: Gradle 8.14 ne sait pas lire les classes
      # Java 25 et echoue des l'analyse des scripts de build sur
      # "Unsupported class file major version 69". Le JDK 25 n'avait ete tente
      # que pour une preversion de loom, desormais ecartee par le resolveur.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # yarn, le loader et Fabric API bougent a chaque publication amont. On les
      # resout au moment du build plutot que de figer dans le depot des numeros
      # qui casseront tout seuls.
      - name: Resolve Fabric versions
        working-directory: apps/client-mod
        run: node scripts/resolve-fabric-versions.mjs

      # Doit rester en phase avec loom_version dans apps/client-mod/gradle.properties:
      # fabric-loom 1.17.19 declare exiger l'API Gradle 9.5.0.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # Avant de compiler: une cible d'injection inexistante ne se voit ni a la
      # compilation ni au remappage, seulement au demarrage du jeu -- et la elle
      # est fatale. Le mod a ete publie deux fois avec une injection sur
      # `onDisconnected`, methode heritee donc absente de la classe ciblee, et
      # plantait chez tous les joueurs pendant que la CI restait verte.
      # Le menu et le launcher ont deja derive une fois, en silence: meme
      # escalier de clarte, deux couleurs differentes. Rien ne casse, rien ne
      # le signale, et on ne s'en apercoit qu'en posant les deux ecrans cote a
      # cote. Ce controle est la seule chose qui empeche que cela recommence.
      #
      # Avant le classpath: il ne lit que deux fichiers de texte, autant le
      # savoir tout de suite plutot qu'apres une resolution Gradle.
      - name: Verify palette matches the launcher
        working-directory: apps/client-mod
        run: node scripts/check-palette.mjs

      # Un appel a une methode supprimee ne se voit pas en local: sans le jar de
      # Minecraft, javac renonce a analyser le corps de toute methode dont la
      # signature reference un type absent -- c'est-a-dire presque toutes les
      # notres. Une refonte du menu a ainsi retire trois accesseurs encore
      # appeles, et seul ce job l'a dit, dix minutes plus tard.
      #
      # Ce controle ne lit que des fichiers texte: il passe avant le classpath,
      # pour la meme raison que celui de la gamme.
      - name: Verify every self-call resolves
        working-directory: apps/client-mod
        run: node scripts/check-own-calls.mjs

      - name: Verify mixin targets exist
        working-directory: apps/client-mod
        run: |
          gradle writeCompileClasspath
          node scripts/check-mixin-targets.mjs

      # Affiche la signature reelle des API sensibles, sur chaque version.
      #
      # Un jar par version de Minecraft ciblee.
      #
      # Sans --stacktrace volontairement: Gradle affiche alors un bloc
      # "What went wrong" de quelques lignes, la ou la trace complete noyait le
      # message d'erreur sous deux cents lignes de pile interne.
      - name: Build every Minecraft target
        working-directory: apps/client-mod
        run: gradle build

      # Lit les vrais noms de champs de la configuration de Sodium.
      #
      # Le launcher installe Sodium mais n'ecrit jamais son sodium-options.json:
      # il le laisse donc aux valeurs d'usine, qui sont prudentes expres. Pour le
      # regler il faut connaitre la forme exacte du fichier -- et Sodium l'a
      # changee entre 0.5 et 0.6.
      #
      # On ne la devine pas. Sodium serialise sa classe d'options avec GSON, donc
      # les noms de champs de la classe *sont* les cles du JSON: `javap -p` les
      # donne sans avoir a lire le depot amont. Meme raison d'etre que la sonde
      # des signatures Minecraft plus bas, et meme regle -- une forme non
      # confirmee par la CI n'est pas une forme verifiee.
      #
      # Cette etape vit ici, avec les autres sondes et le JDK deja installe, meme
      # si elle sert le launcher: les avoir au meme endroit vaut mieux que la
      # symetrie des dossiers.
      #
      # Avant la sonde Minecraft et non apres, pour ne pas repousser hors de
      # portee le verdict du resolveur, qui doit rester la derniere chose
      # imprimee du job -- c'est la seule facon dont on lit un journal de CI.
      #
      # Ne peut pas faire echouer le build: c'est une lecture.
      - name: Probe Sodium config schema
        if: always()
        continue-on-error: true
        run: |
          api="https://api.modrinth.com/v2/project/sodium/version"
          # Une seule version de Minecraft suffit: on cherche la forme du
          # fichier, pas la liste des versions de Sodium.
          query="?loaders=%5B%22fabric%22%5D&game_versions=%5B%221.21.8%22%5D"

          jar_url=$(curl -sSL --max-time 60 "$api$query" \
            | jq -r '[.[] | select(.files | length > 0)][0].files
                     | (map(select(.primary)) + .)[0].url' 2>/dev/null || true)

          if [ -z "$jar_url" ] || [ "$jar_url" = "null" ]; then
            echo "Modrinth injoignable ou aucune version rendue: rien a lire"
            exit 0
          fi

          echo "jar: $jar_url"
          curl -sSL --max-time 120 "$jar_url" -o sodium.jar || exit 0
          mkdir -p sodium-extrait
          unzip -q -o sodium.jar -d sodium-extrait || exit 0

          # Le paquet a change de nom entre 0.5 (me.jellysquid) et 0.6
          # (net.caffeinemc): on cherche par nom de classe, pas par chemin.
          #
          # Les deux enumerations citees par PerformanceSettings sont ajoutees a
          # la main: leurs noms ne contiennent pas « SodiumGameOptions », et sans
          # leurs constantes on ne peut pas ecrire une valeur pour ces champs.
          classes=$(find sodium-extrait \
            \( -name '*SodiumGameOptions*.class' \
               -o -name 'DeferMode.class' \
               -o -name 'QuadSplittingMode.class' \) | sort)
          if [ -z "$classes" ]; then
            echo "aucune classe d options trouvee; classes candidates:"
            find sodium-extrait -name '*Options*.class' | head -20
            exit 0
          fi

          for class in $classes; do
            fqn=$(echo "$class" \
              | sed 's|^sodium-extrait/||; s|\.class$||; s|/|.|g')
            echo "=============== $fqn"
            # Sans filtre sur les methodes, contrairement a une premiere version:
            # les champs donnent les cles du JSON, mais c'est le constructeur qui
            # dit si un fichier partiel est sur. GSON n'execute les initialiseurs
            # que s'il trouve un constructeur sans argument; sinon il alloue
            # l'objet sans l'initialiser, et une section absente du JSON arriverait
            # a null -- le jeu planterait au demarrage. La question ne se devine
            # pas, elle se lit ici.
            javap -p -cp sodium-extrait "$fqn" 2>/dev/null || echo "    (illisible)"
          done

          # Les valeurs par defaut ne sont pas dans la signature: elles sont
          # posees par l'initialiseur. Sans elles on ne sait pas si ce qu'on
          # ecrit change quelque chose -- et c'est toute la question pour
          # cpuRenderAheadLimit, qui est de la latence d'entree deguisee.
          echo "=============== valeurs par defaut (initialiseurs)"
          for nom in AdvancedSettings PerformanceSettings QualitySettings; do
            class=$(find sodium-extrait -name "*SodiumGameOptions\$$nom.class" | head -1)
            [ -z "$class" ] && continue
            fqn=$(echo "$class" | sed 's|^sodium-extrait/||; s|\.class$||; s|/|.|g')
            echo "--- $nom"
            # Le corps du constructeur: une suite de « push <valeur>; putfield
            # <champ> ». On garde les deux, l'ordre suffit a les apparier.
            javap -p -c -cp sodium-extrait "$fqn" 2>/dev/null \
              | sed -n '/[^a-zA-Z]'"$nom"'();/,/^$/p' \
              | grep -E 'push|ldc|iconst|putfield|getstatic' \
              | sed 's/^ *//' || echo "    (illisible)"
          done

      # Quand une classe de Minecraft change de paquet entre deux versions,
      # javac dit seulement "cannot find symbol". Plutot que de deviner le
      # nouveau chemin et de relancer la CI a chaque essai, on va le lire dans
      # les jars remappes par loom.
      - name: Locate moved Minecraft classes
        if: failure()
        run: |
          names="Click KeyInput RenderTickCounter"
          echo "Recherche de: $names"
          find ~/.gradle/caches -name '*.jar' -path '*loom*' 2>/dev/null | while read -r jar; do
            for name in $names; do
              hits=$(unzip -l "$jar" 2>/dev/null \
                | grep -oE "net/minecraft/[a-z0-9/]*${name}\.class" | sort -u || true)
              if [ -n "$hits" ]; then
                echo "$hits" | sed "s|^|  $(basename "$jar"): |"
              fi
            done
          done | sort -u

      - name: List produced jars
        working-directory: apps/client-mod
        run: |
          found=$(find versions -path '*/build/libs/*.jar' ! -name '*-sources.jar' | sort)
          if [ -z "$found" ]; then
            echo "::error::aucun jar produit"
            exit 1
          fi
          echo "$found" | while read -r jar; do
            printf '%s (%s Ko)\n' "$jar" "$(( $(stat -c%s "$jar") / 1024 ))"
          done

      # Gardee en permanence, et pas seulement le temps d'un correctif: c'est
      # l'etape qui a evite le plus d'allers-retours de ce depot. Rien ici ne
      # peut faire echouer le build -- c'est une lecture, pas une verification.
      # Quand une version de Minecraft sortira, ces quelques lignes diront
      # immediatement ce qui a bouge.
      #
      # Placee apres le build, et non avant, pour une raison purement
      # pratique: on ne lit ces signatures qu'a travers le journal du job, et
      # les deux cents lignes de Gradle repoussaient la sonde hors de portee
      # d'une lecture de la fin du journal. En queue, elle se lit d'un coup.
      - name: Probe Minecraft API signatures
        # Surtout quand le build echoue: c'est precisement le moment ou l'on a
        # besoin de savoir a quoi ressemble reellement l'API. Sans ce garde-fou,
        # deplacer la sonde apres le build l'aurait rendue muette dans le seul
        # cas qui compte.
        if: always()
        working-directory: apps/client-mod
        run: |
          for version in 1.21.8 1.21.11 26.1.2 26.2; do
            # Une version que Fabric n'outille pas encore n'a ni classpath ni
            # jar: la sonde n'a rien a lire et ce n'est pas une erreur.
            if [ ! -f "versions/$version/build/compile-classpath.txt" ]; then
              echo "=============== $version (pas encore construite, ignoree)"
              continue
            fi
            cp=$(cat "versions/$version/build/compile-classpath.txt")
            echo "=============== $version"
            # Les quatre premieres entrees sont des cibles de mixin en service:
            # gardees en permanence, elles signaleront le jour ou une version de
            # Minecraft les deplacera. Les suivantes sont les questions encore
            # ouvertes -- ici, escamoter aussi les blocs animes de loin.
            #
            # Les trois dernieres du premier groupe sont en service elles aussi,
            # et elles ont deja
            # rendu service: `Style.withFont` prend un Identifier en 1.21.8 et un
            # StyleSpriteSource ensuite, ce que la sonde a dit avant qu'on ait
            # eu a le deviner. Gardees pour le prochain deplacement. Le motif
            # `ont` plutot que `withFont` sur Style: il attrape aussi un
            # accesseur renomme.
            #
            # Les trois dernieres sont la question ouverte du moment: poser le
            # vrai sprite d'un effet de potion a cote de son nom. Ni l'accesseur
            # du gestionnaire de sprites ni la methode de dessin n'ont la meme
            # signature d'une version a l'autre, et les deviner couterait un
            # build par essai.
            #
            # itemUseCooldown repond a la question des entrees perdues. Le clic
            # droit est verrouille quatre ticks par le client lui-meme, et un
            # clic qui tombe pendant ce verrou n'est pas retarde: il est jete. En
            # combat on clique plus vite que ca, et l'entree disparait sans que
            # le reseau y soit pour rien. On veut la garder et la rejouer au
            # premier tick autorise -- et non renvoyer l'action, ce qui en
            # produirait deux quand le serveur a deja traite la premiere.
            #
            # EndCrystalEntity, ClientWorld, Entity et RemovalReason repondent a
            # une autre question ouverte: en crystal PvP, le client garde
            # l'entite du crystal jusqu'au retour du paquet de suppression, donc
            # sa boite de collision occupe encore la place et empeche d'en poser
            # un nouveau. Le joueur attend un aller-retour de ping complet par
            # crystal, alors que le serveur a deja tout traite. Retirer l'entite
            # des la frappe demande de savoir quelle methode le fait cote client,
            # avec quelle raison de suppression, et dans quel paquet vit
            # EndCrystalEntity -- quatre choses qu'on ne devine pas.
            #
            # Pas de commentaire entre les entrees ci-dessous: un « # » au milieu
            # d'une liste prolongee par « \ » coupe la commande.
            for entry in \
              "net.minecraft.client.render.entity.EntityRenderer:shouldRender" \
              "net.minecraft.entity.player.PlayerEntity:getAttackCooldownProgress|getItemCooldownManager" \
              "net.minecraft.network.packet.c2s.play.PlayerActionC2SPacket$Action:*" \
              "net.minecraft.client.MinecraftClient:doAttack|handleInputEvents|doItemUse|temUseCooldown|tatusEffectSprite" \
              "net.minecraft.entity.player.ItemCooldownManager:*" \
              "net.minecraft.client.network.ClientPlayerInteractionManager:attackEntity|clickSlot|syncSelectedSlot|getCurrentSyncId" \
              "net.minecraft.entity.decoration.EndCrystalEntity:*" \
              "net.minecraft.entity.LivingEntity:ickActiveItemStack|onsumeItem|learActiveItem|temUseTimeLeft|ctiveItemStack|sUsingItem|etCurrentHand" \
              "net.minecraft.client.world.ClientWorld:removeEntity|addEntity" \
              "net.minecraft.entity.Entity:iscard|etRemoved|emove" \
              "net.minecraft.entity.Entity\$RemovalReason:*" \
              "net.minecraft.entity.player.PlayerInventory:getStack|offHand|selectedSlot|getSelectedStack" \
              "net.minecraft.client.particle.ParticleManager:addParticle" \
              "net.minecraft.client.option.InactivityFpsLimiter:update" \
              "net.minecraft.client.render.Frustum:isVisible" \
              "net.minecraft.client.render.WorldRenderer:ntit|rustum|lockEntity" \
              "net.minecraft.client.render.block.entity.BlockEntityRenderer:*" \
              "net.minecraft.client.render.block.entity.BlockEntityRenderManager:get|render|ender" \
              "net.minecraft.block.entity.BlockEntity:getPos|getWorld|getType" \
              "net.minecraft.block.AbstractBlock\$AbstractBlockState:paque|olid|uffer" \
              "net.minecraft.text.Style:ont" \
              "net.minecraft.text.StyleSpriteSource:*" \
              "net.minecraft.text.StyleSpriteSource\$Font:*" \
              "net.minecraft.client.texture.StatusEffectSpriteManager:*" \
              "net.minecraft.entity.effect.StatusEffect:etColor|etName" \
              "net.minecraft.client.gui.DrawContext:rawSprite|rawGuiTexture"
            do
              class="${entry%%:*}"
              members="${entry#*:}"
              echo "--- $class"
              # "*" demande la classe entiere: pour Session on ne connait pas
              # encore le nom des accesseurs, c'est justement ce qu'on cherche.
              if [ "$members" = "*" ]; then
                javap -p -cp "$cp" "$class" 2>/dev/null || echo "    (classe introuvable)"
              else
                javap -p -cp "$cp" "$class" 2>/dev/null \
                  | grep -E "  .*($members)" || echo "    (aucun membre correspondant)"
              fi
            done

            # Une signature ne dit pas tout, et deux questions ouvertes le
            # montrent bien.
            #
            # Rattraper un clic droit que le client jette demande de savoir *ou*
            # le verrou de quatre ticks est teste: dans doItemUse, qui rendrait
            # la main sans rien faire, ou dans handleInputEvents, qui
            # n'appellerait meme pas doItemUse. Le point d'accroche en depend.
            #
            # Finir de manger a l'instant prevu demande de savoir ou le jeu
            # reserve la consommation au serveur. L'animation reste bloquee
            # jusqu'a sa reponse, et ce blocage empeche d'agir -- c'est lui qu'on
            # veut lever, pas la duree de la bouchee.
            #
            # Dans les deux cas la reponse est dans le corps de la methode, pas
            # dans sa signature. On lit donc le bytecode, filtre sur ce qui nous
            # interesse, avec la methode qui le contient.
            for lecture in \
              "net.minecraft.client.MinecraftClient:itemUseCooldown" \
              "net.minecraft.entity.LivingEntity:itemUseTimeLeft|isClient|consumeItem|clearActiveItem"
            do
              corps_classe="${lecture%%:*}"
              corps_motif="${lecture#*:}"
              echo "--- bytecode de ${corps_classe##*.}, sur ($corps_motif)"
              javap -p -c -cp "$cp" "$corps_classe" 2>/dev/null \
                | awk -v motif="$corps_motif" '
                    /^  [a-z].*\(.*\);$/ { methode = $0 }
                    $0 ~ motif {
                      if (methode != vu) { print "  dans" methode; vu = methode }
                      print "     " $0
                    }' \
                | sed 's/^ *//;s/^/    /' || echo "    (illisible)"
            done
          done

          # En toute fin, et non en tete: la sonde elle-meme fait deux cents
          # lignes, et un verdict pose avant elle reste hors de portee d'une
          # lecture par la fin du journal -- ce qui est la seule facon dont on
          # lit un journal de CI. Place ici, c'est la derniere chose imprimee.
          if [ -f build/fabric-resolution.txt ]; then
            echo "=============== resolution Fabric"
            cat build/fabric-resolution.txt
          fi

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: paranoia-client-mod
          if-no-files-found: error
          path: apps/client-mod/versions/*/build/libs/*.jar
