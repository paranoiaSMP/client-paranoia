// Numeros ecrits par scripts/resolve-fabric-versions.mjs, lance par la CI avant
// la compilation. Le fichier n'est pas suivi par git: le figer condamnerait le
// build a casser des qu'un nouveau build yarn ou une nouvelle Fabric API sort.
def versions = new Properties()
def versionsFile = file('versions.properties')
if (!versionsFile.exists()) {
    throw new GradleException(
        "versions.properties absent pour ${project.name}: lancer d'abord " +
        "`node scripts/resolve-fabric-versions.mjs`")
}
versionsFile.withInputStream { versions.load(it) }

dependencies {
    minecraft "com.mojang:minecraft:${versions.minecraft_version}"
    mappings "net.fabricmc:yarn:${versions.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${versions.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${versions.fabric_api_version}"
}
