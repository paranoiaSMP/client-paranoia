org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

mod_version=0.3.0

# Loom est epingle, contrairement a yarn/loader/Fabric API que le resolveur va
# chercher a chaque build.
#
# La raison tient a ce que chacun suit: yarn et Fabric API suivent Minecraft, et
# doivent donc bouger tout seuls sous peine de casser des qu'une version sort.
# Loom, lui, suit Gradle: la 1.17.19 exige Gradle 9.5.0, et prendre "la derniere"
# revenait a laisser un tiers decider de la version de Gradle de la CI -- ce qui
# a effectivement casse le build deux fois.
#
# A mettre a jour de pair avec gradle-version dans .github/workflows/build-mod.yml.
loom_version=1.17.19
