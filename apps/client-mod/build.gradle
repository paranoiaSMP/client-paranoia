plugins {
    id 'fabric-loom' version "${loom_version}" apply false
}

// Le projet racine ne produit rien: il ne fait que porter la configuration
// commune. Chaque sous-projet versions/<mc> construit un jar.
subprojects {
    apply plugin: 'java'
    apply plugin: 'fabric-loom'

    group = 'gg.paranoia'
    version = "${mod_version}+${project.name}"

    // `archivesBaseName` est deprecie depuis Gradle 8 et retire en 9.
    base {
        archivesName = 'paranoia-client'
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
    }

    // Les sources partagees sont ajoutees a chaque sous-projet plutot que
    // compilees une fois: un `common` compile une seule fois ne pourrait pas
    // toucher aux classes de rendu, qui changent d'une version a l'autre.
    sourceSets {
        main {
            java.srcDirs += rootProject.file('src/main/java')

            // Second niveau de partage: ce que toutes les versions ont en
            // commun sauf 1.21.8.
            //
            // Quatre fichiers y vivaient en quatre exemplaires -- plateforme,
            // point d'entree, ecran de menu, mixin de la liste des joueurs --
            // dont trois identiques au caractere pres. Seule 1.21.8 diverge
            // reellement; les autres ne differaient que par le numero de
            // version, que PlatformImpl demande desormais au chargeur. Cinq
            // cents lignes recopiees, et une correction a appliquer trois fois
            // en esperant n'en oublier aucune.
            //
            // La condition porte sur la version qui fait exception, et non sur
            // la liste de celles qui partagent: une nouvelle version de
            // Minecraft rejoint le tronc commun sans qu'on ait a y penser,
            // ce qui est le cas de loin le plus frequent.
            if (project.name != '1.21.8') {
                java.srcDirs += rootProject.file('src/main/java-modern')
            }

            // Traductions et assets communs. fabric.mod.json reste propre a
            // chaque version: il declare la version de Minecraft acceptee.
            resources.srcDirs += rootProject.file('src/main/resources')
        }
    }

    // Le chemin du jar Minecraft remappe n'est connu que de loom, et il change a
    // chaque version. On l'expose pour scripts/check-mixin-targets.mjs, qui va y
    // lire les classes reelles avec javap.
    tasks.register('writeCompileClasspath') {
        def destination = layout.buildDirectory.file('compile-classpath.txt')
        def classpath = provider { sourceSets.main.compileClasspath.asPath }
        outputs.file(destination)
        doLast {
            destination.get().asFile.text = classpath.get()
        }
    }

    processResources {
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') {
            expand 'version': project.version
        }
    }
}
